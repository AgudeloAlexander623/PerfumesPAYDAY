x="1086" y="1294" width="34" height="34" rx="6" class="gold"/><rect x="1096" y="1305" width="14" height="11" rx="3" class="glk"/><path d="M1100 1305 v-2 a3 3 0 0 1 6 0 v2" class="glk"/><rect x="1044" y="1294" width="34" height="34" rx="6" class="out"/><path transform="translate(1061 1311)" d="M0,-4 C-2,-8 -8,-7 -8,-2 C-8,2 -3,5 0,8 C3,5 8,2 8,-2 C8,-7 2,-8 0,-4 Z" class="glm"/><rect x="140" y="1430" width="1000" height="120" rx="14" class="card"/><text x="640" y="1480" class="up" text-anchor="middle">VENTAS AL POR MAYOR</text><text x="640" y="1524" class="h2" text-anchor="middle">Próximamente</text><line x1="0" y1="1590" x2="1280" y2="1590" class="ln"/><text x="140" y="1634" class="h3 gd" text-anchor="start">PERFUMERÍA GOLD</text><text x="140" y="1662" class="m" text-anchor="start">Perfumes para explorar, elegir y</text><text x="140" y="1682" class="m" text-anchor="start">comprar. Proyecto académico: no se</text><text x="140" y="1702" class="m" text-anchor="start">cobra ni se envían productos reales.</text><text x="540" y="1634" class="h3 gd" text-anchor="start">Navegación</text><text x="540" y="1662" class="m" text-anchor="start">Inicio</text><text x="540" y="1684" class="m" text-anchor="start">Catálogo</text><text x="540" y="1706" class="m" text-anchor="start">Mis pedidos</text><text x="780" y="1634" class="h3 gd" text-anchor="start">Atención al cliente</text><text x="780" y="1662" class="m" text-anchor="start">Mi cuenta</text><text x="780" y="1684" class="m" text-anchor="start">Mis pedidos</text><text x="780" y="1706" class="m" text-anchor="start">Carrito de compras</text><line x1="0" y1="1760" x2="1280" y2="1760" class="ln"/><rect x="40" y="1790" width="1200" height="132" rx="10" class="note"/><text x="64" y="1824" class="h3" text-anchor="start">Notas · 1 · Inicio</text><text x="64" y="1856" class="nt" text-anchor="start">• Navbar: Inicio, Catálogo y Mis pedidos; íconos de tema, búsqueda, favoritos, carrito y usuario</text><text x="64" y="1880" class="nt" text-anchor="start">• El ícono de usuario abre el menú (pantalla 8) o lleva al login si no hay sesión</text><text x="64" y="1904" class="nt" text-anchor="start">• Mayoristas aparece como “Próximamente” (alcance de la beta)</text><text x="644" y="1856" class="nt" text-anchor="start">• Los datos del catálogo son marcadores: no hay marcas ni precios reales</text><text x="644" y="1880" class="nt" text-anchor="start">• Aviso visible: simulador académico, sin cobros ni envíos reales</text><text x="644" y="1904" class="nt" text-anchor="start">• Responsive: en móvil el menú se colapsa</text></svg>