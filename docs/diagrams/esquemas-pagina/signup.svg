xt-anchor="start">Teléfono (opcional)</text><rect x="460" y="448" width="360" height="46" rx="8" class="inp"/><text x="476" y="476.0" class="m" text-anchor="start">3000000000</text><text x="460" y="517" class="lb" text-anchor="start">Contraseña</text><rect x="460" y="526" width="360" height="46" rx="8" class="inp"/><text x="476" y="554.0" class="m" text-anchor="start">••••••••</text><text x="460" y="595" class="lb" text-anchor="start">Confirmar contraseña</text><rect x="460" y="604" width="360" height="46" rx="8" class="inp"/><text x="476" y="632.0" class="m" text-anchor="start">••••••••</text><rect x="460" y="688" width="360" height="48" rx="6" class="gold"/><text x="640.0" y="717.0" class="bk" text-anchor="middle">CREAR CUENTA</text><text x="640" y="772" class="m" text-anchor="middle">¿Ya tienes cuenta? <tspan class="gd">Inicia sesión</tspan></text><line x1="0" y1="840" x2="1280" y2="840" class="ln"/><rect x="40" y="870" width="1200" height="132" rx="10" class="note"/><text x="64" y="904" class="h3" text-anchor="start">Notas · L2 · Registro (signUp)</text><text x="64" y="936" class="nt" text-anchor="start">• Campos según la tabla usuarios: nombre_completo, correo y telefono</text><text x="64" y="960" class="nt" text-anchor="start">• La contraseña se guarda como hash (Argon2 o bcrypt)</text><text x="64" y="984" class="nt" text-anchor="start">• Confirmar contraseña debe coincidir; errores por campo</text><text x="644" y="936" class="nt" text-anchor="start">• Rol asignado por defecto: cliente</text><text x="644" y="960" class="nt" text-anchor="start">• Correo único en el sistema</text><text x="644" y="984" class="nt" text-anchor="start">• Límite de intentos en el registro</text></svg>