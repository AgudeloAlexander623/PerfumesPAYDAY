n al cliente</text><text x="780" y="592" class="m" text-anchor="start">Mi cuenta</text><text x="780" y="614" class="m" text-anchor="start">Mis pedidos</text><text x="780" y="636" class="m" text-anchor="start">Carrito de compras</text><line x1="0" y1="690" x2="1280" y2="690" class="ln"/><rect x="40" y="720" width="1200" height="108" rx="10" class="note"/><text x="64" y="754" class="h3" text-anchor="start">Notas · 3 · Mis pedidos</text><text x="64" y="786" class="nt" text-anchor="start">• Cada usuario solo ve sus propios pedidos (validado en el servidor)</text><text x="64" y="810" class="nt" text-anchor="start">• Columnas según tabla pedidos: id, creado_en, total_cop y estado</text><text x="644" y="786" class="nt" text-anchor="start">• Método de pago: siempre “Pago simulado”</text><text x="644" y="810" class="nt" text-anchor="start">• RASTREAR abre el detalle del pedido (pantalla 3.1)</text></svg>