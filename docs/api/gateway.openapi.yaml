components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT RS256 emitido por security-service.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Número de página, base 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Cantidad de elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: q
      in: query
      required: false
      description: Texto de búsqueda parcial.
      schema:
        type: string
        maxLength: 100
    BrandFilter:
      name: brandId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    CategoryFilter:
      name: categoryId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    GenderFilter:
      name: gender
      in: query
      required: false
      schema:
        type: string
        enum: [female, male, unisex]
    FamilyFilter:
      name: fragranceFamily
      in: query
      required: false
      schema:
        type: string
    MinPrice:
      name: minPrice
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    MaxPrice:
      name: maxPrice
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [relevance, price_asc, price_desc, newest]
        default: relevance
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
    FromDate:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ToDate:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    OrderNumber:
      name: orderNumber
      in: query
      required: false
      schema:
        type: string
    CustomerEmail:
      name: customerEmail
      in: query
      required: false
      schema:
        type: string
        format: email
    AuditActor:
      name: actor
      in: query
      required: false
      schema:
        type: string
    AuditEntity:
      name: entity
      in: query
      required: false
      schema:
        type: string
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
    LogoutAll:
      name: all
      in: query
      required: false
      description: Si es true, revoca todas las sesiones del usuario.
      schema:
        type: boolean
        default: false
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 generado por el frontend para evitar duplicados.
      schema:
        type: string
        format: uuid

  requestBodies:
    ProxiedJson:
      required: true
      description: Cuerpo definido en el contrato OpenAPI del servicio.
      content:
        application/json:
          schema: {}

  responses:
    ProxiedSuccess:
      description: Respuesta del servicio correspondiente.
      content:
        application/json:
          schema: {}
    ProxiedCreated:
      description: Recurso creado por el servicio correspondiente.
      content:
        application/json:
          schema: {}
    NoContent:
      description: Operación completada sin cuerpo.
    BadRequest:
      description: Petición mal formada o parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Autenticado sin permiso para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso inexistente o ajeno.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto de negocio o de idempotencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Datos bien formados que incumplen una regla de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Límite de peticiones superado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Error interno no previsto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Dependencia no disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        service:
          type: string
          example: gateway
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          example: 123.45
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Los datos enviados no son válidos.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: email
                  code:
                    type: string
                    example: INVALID_FORMAT
                  message:
                    type: string
                    example: El correo no tiene un formato válido.
            requestId:
              type: string
              format: uuid
              example: 6f1c2a9e-3b7d-4c1a-9e2f-8a4b5c6d7e8f
