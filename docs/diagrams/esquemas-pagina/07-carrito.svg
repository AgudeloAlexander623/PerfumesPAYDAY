ight="48" rx="6" class="gold"/><text x="1070.0" y="491.0" class="bk" text-anchor="middle">CONTINUAR COMPRA</text><rect x="944" y="520" width="252" height="44" rx="6" class="out"/><text x="1070.0" y="547.0" class="bw" text-anchor="middle">SEGUIR COMPRANDO</text><line x1="0" y1="800" x2="1280" y2="800" class="ln"/><text x="140" y="844" class="h3 gd" text-anchor="start">PERFUMERÍA GOLD</text><text x="140" y="872" class="m" text-anchor="start">Perfumes para explorar, elegir y</text><text x="140" y="892" class="m" text-anchor="start">comprar. Proyecto académico: no se</text><text x="140" y="912" class="m" text-anchor="start">cobra ni se envían productos reales.</text><text x="540" y="844" class="h3 gd" text-anchor="start">Navegación</text><text x="540" y="872" class="m" text-anchor="start">Inicio</text><text x="540" y="894" class="m" text-anchor="start">Catálogo</text><text x="540" y="916" class="m" text-anchor="start">Mis pedidos</text><text x="780" y="844" class="h3 gd" text-anchor="start">Atención al cliente</text><text x="780" y="872" class="m" text-anchor="start">Mi cuenta</text><text x="780" y="894" class="m" text-anchor="start">Mis pedidos</text><text x="780" y="916" class="m" text-anchor="start">Carrito de compras</text><line x1="0" y1="970" x2="1280" y2="970" class="ln"/><rect x="40" y="1000" width="1200" height="132" rx="10" class="note"/><text x="64" y="1034" class="h3" text-anchor="start">Notas · 7 · Carrito de compras</text><text x="64" y="1066" class="nt" text-anchor="start">• Cantidad limitada por el stock disponible (controles + y −)</text><text x="64" y="1090" class="nt" text-anchor="start">• La papelera elimina el producto del carrito</text><text x="64" y="1114" class="nt" text-anchor="start">• Un carrito por usuario autenticado</text><text x="644" y="1066" class="nt" text-anchor="start">• Total = suma de precio unitario x cantidad; sin costo de envío real</text><text x="644" y="1090" class="nt" text-anchor="start">• Estado vacío: “Tu carrito está vacío” y botón Explorar catálogo</text><text x="644" y="1114" class="nt" text-anchor="start">• Cupones: fuera del alcance de la beta</text></svg>