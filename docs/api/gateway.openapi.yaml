openapi: 3.1.0

info:
  title: PerfumesPAYDAY Gateway API
  version: 0.1.0
  summary: Superficie pública del gateway de PerfumesPAYDAY.
  description: |
    Borrador del contrato público del gateway. El gateway enruta `/api/v1/*`
    hacia `security-service`, `catalog-service` u `order-service`, valida el
    access token JWT y aplica CORS, Helmet y rate limit.

    Este archivo documenta la **superficie** y el **enrutamiento**. Los cuerpos
    detallados de cada operación viven en el contrato OpenAPI del servicio
    correspondiente (`security.openapi.yaml`, `catalog.openapi.yaml` u
    `orders.openapi.yaml`), que está pendiente.

    Convenciones transversales: ver `docs/api/README.md` y el ADR-0006.
  contact:
    name: Equipo PerfumesPAYDAY
  license:
    name: Proyecto académico

servers:
  - url: http://localhost:3000
    description: Entorno local (puerto propuesto, pendiente de confirmar)
  - url: https://api.example.com
    description: Producción (pendiente de definir)

tags:
  - name: Gateway
    description: Salud y comportamiento propio del gateway.
  - name: Auth
    description: Registro, login, refresh y logout.
  - name: Cuenta
    description: Perfil y contraseña del usuario autenticado.
  - name: Catálogo
    description: Catálogo público de productos.
  - name: Carrito
    description: Carrito autenticado y fusión del carrito de invitado.
  - name: Direcciones
    description: Direcciones de envío del usuario.
  - name: Pedidos
    description: Checkout, historial y detalle de pedidos.
  - name: Administración
    description: Rutas protegidas para el rol admin.

