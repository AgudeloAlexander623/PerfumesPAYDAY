name: perfumespayday-backend

x-environment: &environment
  NODE_ENV: production
  HOST: 0.0.0.0
  LOG_LEVEL: info
  JWT_ISSUER: perfumespayday-security
  JWT_AUDIENCE: perfumespayday-api
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?define_JWT_PUBLIC_KEY_con_npm_run_jwt_keys}

x-service: &service
  restart: unless-stopped
  networks:
    - backend
  environment:
    <<: *environment
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        node -e "fetch('http://127.0.0.1:' + process.env.PORT + '/health')
        .then((r) => process.exit(r.ok ? 0 : 1))
        .catch(() => process.exit(1))"
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  security:
    build:
      context: ../security/security-service
    restart: unless-stopped
    networks:
      - backend
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: "8000"
      JWT_ISSUER: perfumespayday-security
      JWT_AUDIENCE: perfumespayday-api
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?define_JWT_PRIVATE_KEY_con_scripts_generate_jwt_keys}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  gateway:
    <<: *service
    depends_on:
      security:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      <<: *environment
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SECURITY_SERVICE_URL: http://security:8000
      CATALOG_SERVICE_URL: http://catalog:3001
      ORDERS_SERVICE_URL: http://orders:3002
    ports:
      - "3000:3000"

  catalog:
    <<: *service
    build:
      context: .
      args:
        SERVICE: catalog
    environment:
      <<: *environment
      PORT: "3001"
    expose:
      - "3001"

  orders:
    <<: *service
    build:
      context: .
      args:
        SERVICE: orders
    environment:
      <<: *environment
      PORT: "3002"
    expose:
      - "3002"

networks:
  backend:
    driver: bridge
