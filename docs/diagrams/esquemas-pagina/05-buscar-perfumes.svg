io</text><text x="540" y="1258" class="m" text-anchor="start">Catálogo</text><text x="540" y="1280" class="m" text-anchor="start">Mis pedidos</text><text x="780" y="1208" class="h3 gd" text-anchor="start">Atención al cliente</text><text x="780" y="1236" class="m" text-anchor="start">Mi cuenta</text><text x="780" y="1258" class="m" text-anchor="start">Mis pedidos</text><text x="780" y="1280" class="m" text-anchor="start">Carrito de compras</text><line x1="0" y1="1334" x2="1280" y2="1334" class="ln"/><rect x="40" y="1364" width="1200" height="108" rx="10" class="note"/><text x="64" y="1398" class="h3" text-anchor="start">Notas · 5 · Buscar perfumes</text><text x="64" y="1430" class="nt" text-anchor="start">• Filtros activos como etiquetas que se pueden quitar una a una</text><text x="64" y="1454" class="nt" text-anchor="start">• Limpiar todo restablece el catálogo completo</text><text x="644" y="1430" class="nt" text-anchor="start">• La búsqueda se hace por nombre o marca</text><text x="644" y="1454" class="nt" text-anchor="start">• Resultados paginados desde la API (/api/v1)</text></svg>