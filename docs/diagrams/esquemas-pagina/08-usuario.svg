r sesión</text><line x1="0" y1="640" x2="1280" y2="640" class="ln"/><rect x="40" y="670" width="1200" height="108" rx="10" class="note"/><text x="64" y="704" class="h3" text-anchor="start">Notas · 8 · Usuario</text><text x="64" y="736" class="nt" text-anchor="start">• Muestra el nombre y el rol; opciones: Mi perfil, Mis pedidos y Cerrar sesión</text><text x="64" y="760" class="nt" text-anchor="start">• Mi perfil abre la pantalla 8.1 (pendiente)</text><text x="644" y="736" class="nt" text-anchor="start">• Propuesta: si el rol es manager o admin, añadir “Panel de gestión”</text><text x="644" y="760" class="nt" text-anchor="start">• Sin sesión, el ícono lleva al login</text></svg>