anchor="start">Explora</text><text x="390" y="860" class="m" text-anchor="start">Filtra por marca, género y familia</text><circle cx="662" cy="780" r="22" class="gold"/><text x="662" y="786" class="bk" text-anchor="middle">3</text><text x="640" y="836" class="h3" text-anchor="start">Arma tu carrito</text><text x="640" y="860" class="m" text-anchor="start">Elige 30, 50 o 100 ml</text><circle cx="912" cy="780" r="22" class="gold"/><text x="912" y="786" class="bk" text-anchor="middle">4</text><text x="890" y="836" class="h3" text-anchor="start">Simula tu compra</text><text x="890" y="860" class="m" text-anchor="start">Guarda tu dirección y confirma</text><text x="140" y="940" class="up" text-anchor="start">CATÁLOGO DESTACADO</text><text x="140" y="978" class="h2" text-anchor="start">Fragancias para elegir</text><rect x="140" y="1010" width="300" height="330" rx="14" class="card"/><rect x="160" y="1030" width="260" height="150" rx="6" class="ph"/><line x1="160" y1="1030" x2="420" y2="1180" class="phx"/><line x1="420" y1="1030" x2="160" y2="1180" class="phx"/><text x="160" y="1208" class="up" text-anchor="start">[MARCA]</text><text x="160" y="1232" class="tb" text-anchor="start">[NOMBRE DEL PERFUME]</text><rect x="160" y="1246" width="72" height="22" rx="5" class="chip"/><text x="196.0" y="1261" class="m" text-anchor="middle">[Género]</text><rect x="240" y="1246" width="79" height="22" rx="5" class="chip"/><text x="279.5" y="1261" class="m" text-anchor="middle">[Familia]</text><line x1="160" y1="1284" x2="420" y2="1284" class="ln"/><text x="160" y="1318" class="h3" text-anchor="start">$[PRECIO]</text><rect x="386" y="1294" width="34" height="34" rx="6" class="gold"/><rect x="396" y="1305" width="14" height="11" rx="3" class="glk"/><path d="M400 1305 v-2 a3 3 0 0 1 6 0 v2" class="glk"/><rect x="344" y="1294" width="34" height="34" rx="6" class="out"/><path transform="translate(361 1311)" d="M0,-4 C-2,-8 -8,-7 -8,-2 C-8,2 -3,5 0,8 C3,5 8,2 8,-2 C8,-7 2,-8 0,-4 Z" class="gl