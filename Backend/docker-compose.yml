name: perfumesgold-backend

x-environment: &environment
  NODE_ENV: production
  HOST: 0.0.0.0
  LOG_LEVEL: info
  JWT_ISSUER: perfumesgold-security
  JWT_AUDIENCE: perfumesgold-api
  JWT_JWKS_URL: http://security:8000/.well-known/jwks.json

x-service: &service
  restart: unless-stopped
  networks:
    - backend
  environment:
    <<: *environment
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        node -e "fetch('http://127.0.0.1:' + process.env.PORT + '/health')
        .then((r) => process.exit(r.ok ? 0 : 1))
        .catch(() => process.exit(1))"
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  security-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB: security_db
      POSTGRES_USER: security
      POSTGRES_PASSWORD: ${SECURITY_DB_PASSWORD:?define_SECURITY_DB_PASSWORD}
    volumes:
      - security-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security -d security_db"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  security:
    build:
      context: ../security/security-service
    restart: unless-stopped
    depends_on:
      security-db:
        condition: service_healthy
    networks:
      - backend
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: "8000"
      JWT_ISSUER: perfumesgold-security
      JWT_AUDIENCE: perfumesgold-api
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?define_JWT_PRIVATE_KEY_con_scripts_generate_jwt_keys}
      # Rotación (ADR-0003): descomenta el bloque completo al cambiar de clave.
      # Las variables se leen de tu .env; consulta security/.env.example.
      # JWT_PREVIOUS_PRIVATE_KEY: ${JWT_PREVIOUS_PRIVATE_KEY}
      # JWT_PREVIOUS_PUBLIC_KEY: ${JWT_PREVIOUS_PUBLIC_KEY}
      # JWT_PREVIOUS_KEY_ID: ${JWT_PREVIOUS_KEY_ID}
      # JWT_PREVIOUS_KEY_ROTATED_AT: ${JWT_PREVIOUS_KEY_ROTATED_AT}
      JWT_KEY_OVERLAP_SECONDS: ${JWT_KEY_OVERLAP_SECONDS:-86400}
      DATABASE_URL: postgresql+asyncpg://security:${SECURITY_DB_PASSWORD}@security-db:5432/security_db
      REFRESH_TTL_DAYS: "7"
      SESSION_ABSOLUTE_TTL_DAYS: "30"
      LOGIN_MAX_FAILED_ATTEMPTS: "5"
      LOGIN_LOCKOUT_MINUTES: "15"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  gateway:
    <<: *service
    depends_on:
      security:
        condition: service_healthy
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      <<: *environment
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SECURITY_SERVICE_URL: http://security:8000
      CATALOG_SERVICE_URL: http://catalog:3001
      ORDERS_SERVICE_URL: http://orders:3002
    ports:
      - "3000:3000"

  catalog:
    <<: *service
    build:
      context: .
      args:
        SERVICE: catalog
    environment:
      <<: *environment
      PORT: "3001"
    expose:
      - "3001"

  orders:
    <<: *service
    build:
      context: .
      args:
        SERVICE: orders
    environment:
      <<: *environment
      PORT: "3002"
    expose:
      - "3002"

networks:
  backend:
    driver: bridge

volumes:
  security-db-data:
